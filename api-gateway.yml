server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/v1/events/**,/api/v1/venues/**,/api/v1/categories/**,/api/v1/admin/events/**,/api/v1/admin/venues/**,/api/v1/admin/categories/**

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway
