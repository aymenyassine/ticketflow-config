server:
  port: 8084

spring:
  datasource:
    url: jdbc:h2:mem:booking-service;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info

booking:
  expiry-check-ms: 60000