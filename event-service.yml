server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:file:./data/eventflow
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info

event:
  inventory:
    expiry-check-ms: 60000
