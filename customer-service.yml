server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

ticketflow:
  message: "Bienvenue dans TicketFlow - configuration v2.1"


spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/customer_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:ticketflow}
    password: ${DB_PASSWORD:ticketflow}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
